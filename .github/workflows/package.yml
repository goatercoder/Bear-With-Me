# Builds a flat focusling.zip (manifest.json at the top level) on every push, so
# unzipping it gives a folder you can load straight into chrome://extensions.
name: package
on:
  push:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: focusling
          path: dist/focusling.zip
      - name: Attach to release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/focusling.zip
